<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg><use href="#i-code"/></svg></div>
      <div class="brand-text">
        <div class="brand-name">Путь веб-разработчика</div>
        <div class="brand-sub">от нуля до Python-бэкенда</div>
      </div>
    </div>
    <div class="side-scroll" id="sideNav"></div>
    <div class="side-foot">
      <span id="footProgress">—</span>
      <button class="btn btn-sm btn-ghost" id="resetBtn" title="Сбросить весь прогресс">Сброс</button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Меню"><svg><use href="#i-menu"/></svg></button>
      <nav class="crumbs" id="crumbs"></nav>
      <div class="topbar-spacer"></div>
      <div class="search">
        <svg><use href="#i-search"/></svg>
        <input id="searchInput" type="search" placeholder="Поиск по урокам…" autocomplete="off" aria-label="Поиск по урокам">
        <div class="search-hits" id="searchHits" hidden></div>
      </div>
    </header>
    <main class="content" id="view">
      <div class="loading"><div class="spinner"></div><span>Загружаем программу…</span></div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>
